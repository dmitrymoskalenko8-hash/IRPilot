          IRPILOT_ARCHIVE
          base64 -d /tmp/irpilot-project.zip.b64 > /tmp/irpilot-project.zip
          unzip -oq /tmp/irpilot-project.zip -d "$GITHUB_WORKSPACE"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER" >&2
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f -print >&2 || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IR-Pilot-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
